<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>太閤立志伝 算術ゲーム 簡単攻略くん</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20160f;
      --muted: #6b5f50;
      --paper: #f3e6c4;
      --paper-dark: #d7c595;
      --wood: #9b5828;
      --wood-light: #d58d49;
      --accent: #2f7b72;
      --accent-light: #dff4ee;
      --danger: #b7432f;
      --ok: #276f45;
      --shadow: rgba(31, 20, 11, .25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(74, 42, 20, .08) 1px, transparent 1px),
        linear-gradient(rgba(74, 42, 20, .08) 1px, transparent 1px),
        linear-gradient(135deg, #caa062, #f2dfad 35%, #b78448 100%);
      background-size: 28px 28px, 28px 28px, auto;
    }

    main {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(28px, 5vw, 48px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    button, input, select {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 18px;
      align-items: start;
    }

    .board {
      border: 7px solid #7f502a;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .42), rgba(255, 255, 255, 0) 24%),
        repeating-linear-gradient(90deg, rgba(92, 61, 28, .1) 0 1px, transparent 1px 20px),
        var(--paper);
      box-shadow: 0 16px 24px var(--shadow), inset 0 0 0 3px rgba(255, 245, 204, .55);
      padding: clamp(14px, 3vw, 26px);
    }

    .formula-wrap {
      background: linear-gradient(180deg, #eef2f2, #b9bec2);
      border: 3px solid #27313b;
      box-shadow: inset 0 0 18px rgba(25, 30, 42, .35);
      padding: clamp(12px, 2.5vw, 22px);
      overflow: hidden;
    }

    .formula {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: var(--formula-gap, clamp(6px, 1.3vw, 14px));
      max-width: 100%;
      min-width: 0;
    }

    .slot {
      width: var(--slot-size, 72px);
      height: var(--slot-size, 72px);
      border: var(--slot-border, 4px) solid #5d4327;
      background: #c9c0a8;
      color: #090807;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .25);
      text-align: center;
      font-size: var(--slot-font, 46px);
      font-weight: 800;
